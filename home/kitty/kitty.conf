# ==================== Kitty 终端配置文件 ====================
# 这是 Kitty 终端模拟器的配置文件
# 注意：如果使用 home-manager 的 programs.kitty，通常不需要这个文件
# 这个文件作为备用配置保留

# ==================== 字体配置 ====================
# 普通文本字体（使用 Nerd Font 支持图标和特殊符号）
font_family      MesloLGL Nerd Font

# 粗体字体
bold_font        MesloLGL Nerd Font Bold

# 斜体字体
italic_font      MesloLGL Nerd Font Italic

# 粗斜体字体
bold_italic_font MesloLGL Nerd Font Bold Italic

# 字体大小（单位：pt，可以是小数）
font_size 10.0

# ==================== 光标配置 ====================
# 光标形状
# 可选值：block（方块）、beam（竖线）、underline（下划线）
cursor_shape block

# 光标闪烁间隔（单位：秒）
# 0 表示禁用闪烁，负数使用系统默认值
cursor_blink_interval 0

# ==================== 滚动配置 ====================
# 回滚缓冲区大小（保存的历史命令行数）
# 这决定了你可以向上滚动查看多少历史输出
scrollback_lines 10000

# ==================== 窗口配置 ====================
# 窗口内边距宽度（所有边的内边距，单位：像素）
window_padding_width 5

# 记住窗口大小
# yes：关闭后重新打开时恢复之前的窗口大小
# no：每次都使用初始窗口大小
remember_window_size  yes

# 初始窗口宽度（单位：像素）
initial_window_width  640

# 初始窗口高度（单位：像素）
initial_window_height 400

# ==================== 背景透明度配置 ====================
# 背景不透明度（0.0 = 完全透明，1.0 = 完全不透明）
# 0.8 表示 80% 不透明度，有轻微透明效果
background_opacity 0.8

# 背景模糊程度（单位：像素）
# 仅在支持的 Wayland 合成器（如 KWin）下生效
# 数值越大，模糊效果越明显
background_blur 80

# ==================== 选择与复制配置 ====================
# 选中文本时自动复制到剪贴板
# yes：选中即复制，no：需要手动复制
copy_on_select yes

# ==================== 主题配置 ====================
# 包含主题配置文件（Catppuccin Mocha 配色方案）
# 主题文件定义了终端的颜色方案
include current-theme.conf

# ==================== 窗口装饰配置 ====================
# 是否隐藏窗口装饰（标题栏、边框等）
# no：显示窗口装饰，yes：隐藏窗口装饰
hide_window_decorations no

# ==================== 性能优化配置 ====================
# 重绘延迟（单位：毫秒）
# 控制屏幕刷新的最小间隔
# 值越小越流畅，但 CPU 占用越高
repaint_delay 10

# 输入延迟（单位：毫秒）
# 用于批处理键盘输入以提高性能
# 值越小响应越快，但可能增加 CPU 占用
input_delay 3

# 同步到显示器刷新率
# yes：减少画面撕裂，no：可能更流畅但有撕裂
sync_to_monitor yes

# ==================== 标签页配置 ====================
# 标签栏显示位置
# 可选值：top（顶部）、bottom（底部）、left（左侧）、right（右侧）
tab_bar_edge bottom

# 标签栏样式
# 可选值：fade（淡入淡出）、slant（倾斜）、separator（分隔符）、powerline（电力线）
tab_bar_style powerline

# Powerline 样式的标签栏细节
# 可选值：angled（有角度）、slanted（倾斜）、round（圆形）
tab_powerline_style slanted

# ==================== 鼠标配置 ====================
# 鼠标不活动后隐藏的时间（单位：秒）
# 0 表示不隐藏鼠标，负数使用系统默认值
mouse_hide_wait 3.0

# URL 链接的颜色（十六进制颜色值）
url_color #0087bd

# URL 下划线样式
# 可选值：none（无）、straight（直线）、double（双线）、curly（波浪线）、dotted（点线）、dashed（虚线）
url_style curly

# ==================== 响铃配置 ====================
# 是否启用音频响铃
# yes：终端响铃时发出声音，no：静音
enable_audio_bell no

# 视觉响铃持续时间（单位：秒）
# 0 表示禁用视觉响铃
# 视觉响铃是指屏幕闪烁来提示响铃
visual_bell_duration 0.0

# ==================== 剪贴板配置 ====================
# 剪贴板访问控制
# write-clipboard：允许程序写入系统剪贴板
# write-primary：允许程序写入主选择区（X11）
# read-clipboard：允许程序读取系统剪贴板
# read-primary：允许程序读取主选择区（X11）
clipboard_control write-clipboard write-primary read-clipboard read-primary
