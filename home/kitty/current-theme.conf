# ==================== Catppuccin Mocha 主题配置 ====================
# Catppuccin 是一个流行的柔和深色配色方案
# Mocha 是 Catppuccin 系列中最深的变体，适合长时间使用

# ==================== 基础颜色 ====================
# 前景色（文本颜色）- 浅蓝灰色
foreground              #CDD6F4

# 背景色（终端背景）- 深蓝黑色
background              #1E1E2E

# 选中文本的前景色（选中文本的颜色）- 深色
selection_foreground    #1E1E2E

# 选中文本的背景色（高亮背景）- 浅粉色
selection_background    #F5E0DC

# ==================== 光标颜色 ====================
# 光标颜色 - 浅粉色
cursor                  #F5E0DC

# 光标下文字的颜色 - 深色
cursor_text_color       #1E1E2E

# ==================== URL 链接颜色 ====================
# 鼠标悬停在 URL 上时的下划线颜色 - 浅粉色
url_color               #F5E0DC

# ==================== Kitty 窗口边框颜色 ====================
# 活动窗口边框颜色 - 浅蓝色
active_border_color     #B4BEFE

# 非活动窗口边框颜色 - 灰色
inactive_border_color   #6C7086

# 响铃时边框颜色 - 黄色
bell_border_color       #F9E2AF

# ==================== 操作系统窗口标题栏颜色 ====================
# Wayland 系统下的标题栏颜色（使用系统默认）
wayland_titlebar_color system

# macOS 系统下的标题栏颜色（使用系统默认）
macos_titlebar_color system

# ==================== 标签栏颜色 ====================
# 活动标签的前景色（文字颜色）- 深色
active_tab_foreground   #11111B

# 活动标签的背景色 - 紫色
active_tab_background   #CBA6F7

# 非活动标签的前景色 - 浅灰蓝色
inactive_tab_foreground #CDD6F4

# 非活动标签的背景色 - 深灰色
inactive_tab_background #181825

# 标签栏整体背景色 - 极深色
tab_bar_background      #11111B

# ==================== 标记文本颜色 ====================
# 终端中标记（mark）功能使用的颜色
# 标记可以用来高亮显示特定的文本区域

# 第一种标记的前景色 - 深色
mark1_foreground #1E1E2E
# 第一种标记的背景色 - 浅蓝色
mark1_background #B4BEFE

# 第二种标记的前景色 - 深色
mark2_foreground #1E1E2E
# 第二种标记的背景色 - 紫色
mark2_background #CBA6F7

# 第三种标记的前景色 - 深色
mark3_foreground #1E1E2E
# 第三种标记的背景色 - 青色
mark3_background #74C7EC

# ==================== 16 色终端调色板 ====================
# ANSI 颜色定义，用于终端显示各种颜色
# color0-7 是普通颜色，color8-15 是对应的明亮版本

# 黑色系
# color0: 普通黑色 - 深灰色
color0 #45475A
# color8: 明亮黑色 - 中灰色
color8 #585B70

# 红色系
# color1: 普通红色 - 粉红色
color1 #F38BA8
# color9: 明亮红色 - 粉红色（同上）
color9 #F38BA8

# 绿色系
# color2: 普通绿色 - 薄荷绿
color2  #A6E3A1
# color10: 明亮绿色 - 薄荷绿（同上）
color10 #A6E3A1

# 黄色系
# color3: 普通黄色 - 浅黄色
color3  #F9E2AF
# color11: 明亮黄色 - 浅黄色（同上）
color11 #F9E2AF

# 蓝色系
# color4: 普通蓝色 - 天蓝色
color4  #89B4FA
# color12: 明亮蓝色 - 天蓝色（同上）
color12 #89B4FA

# 品红色系（洋红色）
# color5: 普通品红色 - 浅紫色
color5  #F5C2E7
# color13: 明亮品红色 - 浅紫色（同上）
color13 #F5C2E7

# 青色系
# color6: 普通青色 - 薄荷青
color6  #94E2D5
# color14: 明亮青色 - 薄荷青（同上）
color14 #94E2D5

# 白色系
# color7: 普通白色 - 浅灰蓝色
color7  #BAC2DE
# color15: 明亮白色 - 中灰蓝色
color15 #A6ADC8
